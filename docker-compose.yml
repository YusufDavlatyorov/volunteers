# KhayrKhoh (khayrkhoh.tj) — production compose file.
#
# Services: web (gunicorn, HTTP), ws (uvicorn, WebSockets only — /ws/),
# telegram_bot (long polling), celery_worker (background email/Telegram
# delivery) — all the same image — plus redis (shared cache, cached sessions,
# Celery broker, Channels layer). PostgreSQL is NOT started
# here — this project connects to the pre-existing shared_postgres container
# over the shared external Docker network named by SHARED_POSTGRES_NETWORK in
# .env (see .env.example). Do not add a postgres service here.
#
# Static/media are bind-mounted to host directories so an external reverse
# proxy (nginx, on the host) can serve them directly — see DEPLOY.md.
#
# Migrations and collectstatic run as one-off containers from the new image
# BEFORE `up -d` (DEPLOY.md "Redeploying") — not automatically on start.

# Settings every app container shares (on top of .env): Redis for the cache and
# as the Celery broker. These win over anything in .env (DJANGO_DB_CACHE is no
# longer used in production — the Redis cache replaces the DB cache table).
x-app-env: &app-env
  DJANGO_REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  DJANGO_CHANNEL_REDIS_URL: "redis://redis:6379/2"
  DJANGO_DB_CACHE: "False"

services:
  web:
    build: .
    image: khayrkhoh:latest
    container_name: khayrkhoh_web
    restart: unless-stopped
    mem_limit: 700m
    cpus: 1.0
    env_file:
      - .env
    environment:
      <<: *app-env
      # Content-hashed static filenames (ManifestStaticFilesStorage) so nginx
      # can cache /static/ for a year — see server/settings.py STATIC_MANIFEST.
      # Requires collectstatic before web starts (DEPLOY.md "Redeploying").
      DJANGO_STATIC_MANIFEST: "True"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      # Loopback-only — the host nginx reverse proxies to this port and
      # terminates TLS for khayrkhoh.tj / www.khayrkhoh.tj.
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
    networks:
      - shared_postgres_net
      - internal

  ws:
    # WebSockets (Django Channels, server/asgi.py) under uvicorn, one worker.
    # nginx routes /ws/ here and everything else to `web`, so the HTTP stack
    # stays the tuned sync gunicorn. Same static setup as `web` so the ASGI
    # app could also take HTTP later without surprises.
    image: khayrkhoh:latest
    container_name: khayrkhoh_ws
    command: ["uvicorn", "server.asgi:application", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*", "--ws-max-size", "16384", "--no-access-log"]
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    environment:
      <<: *app-env
      DJANGO_STATIC_MANIFEST: "True"
    volumes:
      - ./staticfiles:/app/staticfiles
    ports:
      # Loopback-only — host nginx proxies /ws/ (Upgrade/Connection) here.
      - "127.0.0.1:8001:8001"
    depends_on:
      - redis
    networks:
      - shared_postgres_net
      - internal

  celery_worker:
    # Delivers queued notifications (myapp/tasks.py) with retries/backoff.
    # Threads pool: the sends are I/O-bound (SMTP / Telegram HTTP), it is light
    # on a 1-vCPU host, and Celery's default prefork pool (billiard) crashed
    # every task with "not enough values to unpack" on Python 3.14 in testing.
    image: khayrkhoh:latest
    container_name: khayrkhoh_celery_worker
    command: ["celery", "-A", "server", "worker", "--pool=threads", "--concurrency=4", "--loglevel=INFO"]
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      - redis
    networks:
      - shared_postgres_net
      - internal

  telegram_bot:
    # Long-polling Telegram bot — a separate process from gunicorn, same
    # image and .env. No ports: it only makes outbound calls to Telegram.
    image: khayrkhoh:latest
    container_name: khayrkhoh_telegram_bot
    command: ["python", "manage.py", "run_telegram_bot"]
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      - web
      - redis
    networks:
      - shared_postgres_net
      - internal

  # Self-hosted routing (optional, `docker compose --profile osrm up -d`).
  # Data is prepared OFF the server with scripts/osrm_build.sh (preprocessing
  # peaks ~1.1 GB) and copied to ./osrm-data/{car,foot}/; these only serve it.
  # The image tag must match the build script (OSRM data is versioned).
  # Measured 2026-10-02 after 300 routes each: car ≈ 223 MiB, foot ≈ 261 MiB,
  # p50 8–10 ms. App containers reach them as http://osrm_car:5000 and
  # http://osrm_foot:5000 (OSRM_BASE_URL / OSRM_FOOT_BASE_URL in .env).
  osrm_car:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: khayrkhoh_osrm_car
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/tajikistan-latest.osrm"]
    restart: unless-stopped
    mem_limit: 400m
    volumes:
      - ./osrm-data/car:/data:ro
    networks:
      - internal

  osrm_foot:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: khayrkhoh_osrm_foot
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/tajikistan-latest.osrm"]
    restart: unless-stopped
    mem_limit: 400m
    volumes:
      - ./osrm-data/foot:/data:ro
    networks:
      - internal

  redis:
    # Cache + Celery broker. Private network only, no published port.
    # appendonly: queued notifications survive a restart. volatile-lru: under
    # memory pressure evict only keys with a TTL (cache entries — every Django
    # cache key has one), never the Celery queue (no TTL).
    image: redis:7-alpine
    container_name: khayrkhoh_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    restart: unless-stopped
    mem_limit: 192m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

volumes:
  redis_data:

networks:
  shared_postgres_net:
    external: true
    name: ${SHARED_POSTGRES_NETWORK:-shared_postgres_net}
  internal:
