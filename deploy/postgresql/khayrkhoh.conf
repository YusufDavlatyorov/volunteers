# KhayrKhoh — PostgreSQL 16 tuning: /etc/postgresql/16/main/conf.d/khayrkhoh.conf
# (Ubuntu's postgresql.conf includes conf.d/; later files win).
# Apply: sudo systemctl restart postgresql   (shared_buffers needs a restart)
#
# Sized for the production host: 1 vCPU, 3.8 GB RAM, shared with the app.
# RAM budget (2026-10 measurements / limits): web ≤ 900 MB, celery ≤ 300 MB,
# bot ≤ 300 MB (+ community bot ≤ 200 MB later), redis ≤ 128 MB data, nginx +
# OS ≈ 300-400 MB, a future OSRM ≈ 0.5 GB. That leaves PostgreSQL ≈ 0.5 GB of
# its own memory plus whatever the OS page cache gets — the database itself is
# tens of MB, so it is cached entirely either way.
#
# The old shared_postgres container ran the postgres:16 image defaults
# (shared_buffers 128MB, work_mem 4MB, max_connections 100) unless MIGRATION.md
# step 1 shows otherwise — if it lists non-default values, carry them over here.

listen_addresses = 'localhost'      # never reachable from outside (ufw too)

# Memory
shared_buffers = 512MB              # ≈ 13 % of RAM: shared host, small DB
effective_cache_size = 1GB          # planner hint only, allocates nothing
work_mem = 8MB                      # per sort/hash node; CRM analytics aggregates
maintenance_work_mem = 128MB        # VACUUM / CREATE INDEX / restore

# Connections. Real use ≈ 10-30: 3 web workers (no persistent connections under
# ASGI, ≤ ~6 threads each with Channels), celery 4 threads, 2 bots, cron, shell.
max_connections = 50

# Log slow queries (to /var/log/postgresql/, rotated by postgresql-common).
log_min_duration_statement = 1000   # ms
