# KhayrKhoh — /etc/nginx/sites-available/khayrkhoh (symlinked into sites-enabled).
#
# nginx serves /static/ and /media/ straight from disk and proxies everything
# else — pages and WebSockets (/ws/) alike — to the one ASGI app,
# khayrkhoh-web.service on 127.0.0.1:8000.
#
# Certificates: certbot (`certbot --nginx -d khayrkhoh.tj -d www.khayrkhoh.tj`)
# — the ssl_* lines below are the paths it creates; renewal runs from
# certbot.timer and needs no change here. A fresh server first gets a plain
# HTTP block to obtain the certificate (DEPLOY.md §8), then this file.
# After any edit: sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade: "Connection: upgrade" only when the client asked for it.
# Defined once per nginx (http context — this file is included inside http {}).
# Do not also keep a copy in /etc/nginx/conf.d/ — nginx refuses a duplicate.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (both names) -> https://khayrkhoh.tj, path kept
server {
    listen 80;
    listen [::]:80;
    server_name khayrkhoh.tj www.khayrkhoh.tj;
    return 301 https://khayrkhoh.tj$request_uri;
}

# https://www -> https://khayrkhoh.tj, path kept (one canonical host — SEO)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khayrkhoh.tj;
    ssl_certificate /etc/letsencrypt/live/khayrkhoh.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khayrkhoh.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://khayrkhoh.tj$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name khayrkhoh.tj;
    ssl_certificate /etc/letsencrypt/live/khayrkhoh.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khayrkhoh.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6M;   # uploads are capped at 5 MB by the app

    # Keep open file descriptors / stat() results of static + media files
    # (many small files on every page) instead of re-opening them per request.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # text/html is always compressed once gzip is on; add the static types.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Brotli (apt: libnginx-mod-http-brotli-filter) — ~15-20% smaller than gzip
    # for CSS/JS/HTML; gzip stays the fallback. Already-compressed media
    # (fonts, images, video) is in neither list.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types text/plain text/css text/xml application/javascript application/json
                 application/xml image/svg+xml;

    # Content-hashed static files (DJANGO_STATIC_MANIFEST=True →
    # ManifestStaticFilesStorage: name.<12 hex>.ext). A changed file gets a new
    # name, so the same URL never changes content: cache for a year, immutable.
    # Covers CSS/JS/fonts/images.
    location ~ "^/static/(.+\.[0-9a-f]{12}\.[A-Za-z0-9]+)$" {
        alias /opt/khayrkhoh/staticfiles/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # Unhashed originals (collectstatic keeps them too, e.g. for a hand-typed
    # URL) — these can change under the same name, so keep the cache modest.
    location /static/ {
        alias /opt/khayrkhoh/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # WebSockets (Django Channels) — the same gunicorn/uvicorn app as the pages.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;               # AllowedHostsOriginValidator
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                  # clients heartbeat every 25 s
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Chat photos are private: never served straight from /media/ …
    location ^~ /media/chat/ { return 404; }
    # … only through the permission-checked view's X-Accel-Redirect
    # (DJANGO_MEDIA_X_ACCEL=True in .env).
    location ^~ /protected-media/ {
        internal;
        alias /opt/khayrkhoh/media/;
        add_header Cache-Control "private, no-store";
    }

    # Uploads. Every upload has a random name and its WebP variants are
    # <name>_thumb/_medium.webp, so a URL never changes content — a month of
    # cache is safe. nosniff: user files are served as their image type only.
    location /media/ {
        alias /opt/khayrkhoh/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        sendfile on;
        tcp_nopush on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # server/client_ip.py trusts X-Real-IP from this loopback hop only.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # What DJANGO_BEHIND_TLS_PROXY=True trusts — without it Django sees
        # plain HTTP and redirect-loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
