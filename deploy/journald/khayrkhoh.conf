# KhayrKhoh — journal size cap: /etc/systemd/journald.conf.d/khayrkhoh.conf
# Apply: sudo systemctl restart systemd-journald
#
# All app logs (khayrkhoh-web / -celery / -telegram-bot, Django's LOGGING →
# stderr) go to the journal: `journalctl -u khayrkhoh-web --since -1h`.
# These logs ARE the operational audit trail (CLAUDE.md → "Health checks &
# operational logging") — keep a month, but never let them fill the disk.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=2G
SystemMaxFileSize=50M
MaxRetentionSec=1month
