# KhayrKhoh — Redis settings: /etc/redis/khayrkhoh.conf, loaded by one line
# appended at the END of /etc/redis/redis.conf (later directives win):
#     include /etc/redis/khayrkhoh.conf
# Apply: sudo systemctl restart redis-server
#
# Same settings as the redis container ran before (2026-10). Databases:
# 0 = Django cache + cached sessions + rate limits, 1 = Celery queue,
# 2 = Channels layer (WebSockets).

# Local only (Ubuntu's default too) — never reachable from outside.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Queued notifications survive a restart: append-only file, no RDB snapshots.
appendonly yes
save ""

# Under memory pressure evict only keys with a TTL (cache entries — every
# Django cache key has one), never the Celery queue (no TTL).
maxmemory 128mb
maxmemory-policy volatile-lru
