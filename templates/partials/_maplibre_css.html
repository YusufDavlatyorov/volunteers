{% load maplibre %}{# MapLibre GL CSS from unpkg (fast CDN, SRI-pinned); if unpkg fails on this visitor's network, the same file from our own static copy. URLs/hashes: myapp/templatetags/maplibre.py. #}
<link rel="stylesheet" href="{% maplibre 'css' %}" integrity="{% maplibre 'css_sri' %}" crossorigin="" onerror="this.onerror=null;this.removeAttribute('integrity');this.href='{% maplibre 'css_local' %}'">
