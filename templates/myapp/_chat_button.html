{% comment %}"Open chat" + unread badge (feature 8). Rendered via {% chat_button task unread %} only where
task|chat_readable:user is true. live-ui.js subscribes to task_<id> and bumps [data-chat-unread] on chat.message.{% endcomment %}
<a class="button {{ variant }} chat-entry" href="{% url 'task_chat' task.pk %}" data-chat-entry data-task-id="{{ task.pk }}">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4L3 21l1.1-4.5A8.4 8.4 0 1 1 21 11.5Z"></path></svg>
    <span data-i18n="chat.open">Open chat</span>
    <span class="chat-entry__badge" data-chat-unread data-task-id="{{ task.pk }}" data-count="{{ unread }}" data-i18n="chat.unread" data-i18n-args="{&quot;count&quot;: {{ unread }}}"{% if not unread %} hidden{% endif %}>Новых: {{ unread }}</span>
</a>
