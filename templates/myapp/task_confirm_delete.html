{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<section class="form-shell">
    <div class="card" style="text-align:center;">
        <h1 data-i18n="delete.title">Confirm Deletion</h1>
        <p data-i18n="delete.msg">Are you sure you want to delete this?</p>
        <form method="post">
            {% csrf_token %}
            <button class="danger" type="submit" data-i18n="delete.yes">Yes, Delete</button>
            <a class="button ghost" href="javascript:history.back()" data-i18n="delete.no">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
