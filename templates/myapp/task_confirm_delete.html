{% extends "base.html" %}
{% block title %}Confirm Delete - Generation Connect{% endblock %}
{% block content %}
<section class="status-screen">
    <div class="status-card">
        <div class="status-icon is-rejected">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
        </div>
        <h1 data-i18n="delete.title">Confirm Deletion</h1>
        <p data-i18n="delete.msg">Are you sure you want to delete this?</p>
        <form method="post" class="button-row">
            {% csrf_token %}
            <button class="button danger" type="submit" data-i18n="delete.yes">Yes, Delete</button>
            <a class="button ghost" href="javascript:history.back()" data-i18n="delete.no">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
