{% extends "base.html" %}
{% block title %}Forgot Password - Generation Connect{% endblock %}
{% block content %}
<section class="form-shell">
    <div class="card">
        <h1 data-i18n="forgot.title" style="text-align: center;">Forgot Password</h1>
        <p class="lede" style="text-align:center; margin: 0 auto 1.4rem;" data-i18n="forgot.desc">Enter your email and the system will send a password reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary" type="submit" data-i18n="forgot.btn">Send Reset Link</button>
        </form>
    </div>
</section>
{% endblock %}
