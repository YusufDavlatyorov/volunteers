{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<section class="form-shell">
    <div class="card">
        <h1 data-i18n="edit.title" style="font-size: 30px;">Edit Profile</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ user_form.as_p }}
            {{ profile_form.as_p }}
            <button class="primary" type="submit" data-i18n="edit.save">Save</button>
        </form>
    </div>
</section>
{% endblock %}
