{% extends "base.html" %}
{% block title %}Reset Password - Generation Connect{% endblock %}
{% block content %}
<section class="form-shell">
    <div class="card">
        <h1 data-i18n="reset.title">New Password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary" type="submit" data-i18n="reset.btn">Save Password</button>
        </form>
    </div>
</section>
{% endblock %}
