{% extends "base.html" %}
{% block title %}Error - Generation Connect{% endblock %}
{% block content %}
<div class="error-wrapper">
    <div class="error-glass-card">
        <div class="error-bg-glow"></div>
        <div class="error-code-container">
            <h1 class="error-code">404</h1>
            <div class="error-code-overlay">404</div>
        </div>
        <h2 data-i18n="error.title" style="font-weight:800; font-size:1.5rem; margin:20px 0 10px;">Lost in Connection?</h2>
        <p data-i18n="error.desc" style="font-size:0.95rem; line-height:1.6; margin-bottom:20px;">The page you are looking for has been disconnected or moved to another care node.</p>
        {% if error %}
            <p style="color: var(--accent); font-size: 0.85rem; margin-bottom: 20px;">{{ error }}</p>
        {% endif %}
        <a href="{% url 'home' %}" class="btn-back-home" data-i18n="error.back">Back to Safety</a>
    </div>
</div>
{% endblock %}
